<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>Kimi Radar — 从用户信号到增长实验</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳转到内容</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#radar" aria-label="Kimi Radar 首页">
        <span class="brand-mark">k</span>
        <span class="brand-text">kimi radar</span>
      </a>
      <nav aria-label="主导航">
        <button data-page="radar" class="nav-item active"><span class="nav-symbol">◎</span>机会雷达<span class="nav-count" id="nav-count">–</span></button>
        <button data-page="studio" class="nav-item"><span class="nav-symbol">▤</span>实验工作室</button>
      </nav>
      <div class="sidebar-bottom">
        <div id="scan-console"></div>
        <div class="side-meta" id="side-meta"></div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="search-wrap"><span class="s-icon">⌕</span><input class="global-search" id="global-search" placeholder="搜索机会、用户问题…" aria-label="搜索机会"></div>
        <div class="top-actions">
          <span class="mode-dot" id="mode-dot"></span><span class="mode-text" id="mode-label">连接中…</span>
          <button class="icon-btn" id="refresh-state" aria-label="刷新连接状态" title="刷新连接状态">↻</button>
        </div>
      </header>
      <div id="data-banner" class="data-banner" role="status" hidden></div>
      <main id="main" tabindex="-1">
        <div class="loading-state"><h1>正在整理工作空间</h1><div class="skeleton"></div><div class="skeleton short"></div></div>
      </main>
      <footer><span>Kimi Radar · 本地运营工具</span><span>不自动发布到 X</span></footer>
    </div>
  </div>
  <dialog id="opportunity-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog" style="padding:26px">
      <h2 id="confirm-title">记录未保存</h2>
      <p style="color:var(--muted);font-size:13px;margin:8px 0 18px">当前实验有未保存的修改。保留当前编辑，或放弃修改后继续。</p>
      <div class="actions"><button value="cancel" class="button">继续编辑</button><button value="discard" class="button primary">放弃修改</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
